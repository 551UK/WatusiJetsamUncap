name: Build WatusiJetsamUncap

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Install Debian packaging tools
        run: brew install dpkg

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Package: com.551.watusijetsamuncap$' control
          grep -q '^Version: 1.2.0$' control
          grep -q '#define WJU_TARGET_MIB 512' Tweak.x
          grep -q 'ServiceExtension.appex/ServiceExtension' Tweak.x
          grep -q 'MEMORYSTATUS_CMD_SET_MEMLIMIT_PROPERTIES' Tweak.x
          grep -q 'MEMORYSTATUS_CMD_GET_MEMLIMIT_PROPERTIES' Tweak.x
          grep -q 'log_effective_limit' Tweak.x

      - name: Build rootless DEB
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .theos packages
          THEOS_PACKAGE_SCHEME=rootless make clean
          THEOS_PACKAGE_SCHEME=rootless \
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6 \
          make package FINALPACKAGE=1 \
          _THEOS_PLATFORM_DPKG_DEB="$(command -v dpkg-deb)"

          DEB=$(find packages -type f -name '*.deb' | head -n 1)
          test -n "$DEB"
          dpkg-deb --info "$DEB"

          ARCH=$(dpkg-deb -f "$DEB" Architecture)
          PACKAGE=$(dpkg-deb -f "$DEB" Package)
          VERSION=$(dpkg-deb -f "$DEB" Version)
          test "$ARCH" = 'iphoneos-arm64'
          test "$PACKAGE" = 'com.551.watusijetsamuncap'
          test "$VERSION" = '1.2.0'

      - name: Upload compiled DEB
        uses: actions/upload-artifact@v4
        with:
          name: WatusiJetsamUncap-v1.2.0-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error
